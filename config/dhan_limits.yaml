# Dated DhanHQ API Rate Limits Configuration
# Source: DhanHQ Documentation v2.5 (dhan-api-docs.md) and ShreeNexa Technical Spec v1.2
#
# Rates are specified in requests per second (req/sec).
# Burst represents the maximum token bucket capacity.

schema_version: 1
as_of: "2026-09-03"
source: "https://dhanhq.co/docs/v2/"
notes: "Verified DhanHQ v2.5 rate limits (dhan-api-docs.md Rate Limit table): Orders 10/s and 7,000/day; Data 5/s and 100,000/day; Quotes 1/s; Option Chain 1 req/3s per underlying. The 7,000/day cap applies to Order APIs only."

default_limit:
  rate: 10.0
  burst: 10

backoff:
  base_delay_seconds: 0.05
  max_delay_seconds: 2.0
  jitter_ratio: 0.25

categories:
  default:
    rate: 10.0
    burst: 10
    description: "General REST API requests"

  option_chain:
    rate: 0.3333333333333333
    burst: 1
    description: "Option chain requests (1 request per 3 seconds per unique underlying/expiry combination)"

  historical_daily:
    rate: 5.0
    burst: 5
    per_day: 100000
    description: "Daily historical chart data (Data APIs: 5 req/s, 100,000/day)"

  historical_intraday:
    rate: 5.0
    burst: 5
    per_day: 100000
    description: "Intraday and rolling-option chart data (Data APIs: 5 req/s, 100,000/day)"

  quotes:
    rate: 1.0
    burst: 1
    description: "Market quote and depth REST requests (1 req/s across all quote endpoints, max 1000 instruments/call)"

  orders:
    rate: 10.0
    burst: 10
    per_minute: 250
    per_hour: 1000
    per_day: 7000
    description: "Order placement, modification, slicing, and cancellation requests (10 req/s, 250/min, 1000/hr, 7000/day)"

  account_funds_holdings:
    rate: 10.0
    burst: 10
    description: "Account profile, token renewal, funds limits, holdings, positions, and static IP requests"
