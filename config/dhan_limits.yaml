# Dated DhanHQ API Rate Limits Configuration
# Source: DhanHQ Documentation v2 (https://dhanhq.co/docs/v2/) and ShreeNexa Technical Spec v1.1
#
# Rates are specified in requests per second (req/sec).
# Burst represents the maximum token bucket capacity.

schema_version: 1
as_of: "2026-09-01"
source: "https://dhanhq.co/docs/v2/"
notes: "Dhan rate limits with confirmed option chain limit (1 req/3s) and conservative defaults for REST endpoints."

default_limit:
  rate: 10.0
  burst: 20

backoff:
  base_delay_seconds: 0.05
  max_delay_seconds: 2.0
  jitter_ratio: 0.25

categories:
  default:
    rate: 10.0
    burst: 20
    description: "General REST API requests"

  option_chain:
    rate: 0.3333333333333333
    burst: 1
    description: "Option chain requests (1 request per 3 seconds per spec section 3.4)"

  historical_daily:
    rate: 5.0
    burst: 10
    description: "Daily historical chart data requests"

  historical_intraday:
    rate: 5.0
    burst: 10
    description: "Intraday minute historical chart data requests"

  quotes:
    rate: 10.0
    burst: 20
    description: "Market quote and depth REST requests"

  orders:
    rate: 25.0
    burst: 50
    description: "Order placement, modification, and cancellation requests"

  account_funds_holdings:
    rate: 10.0
    burst: 20
    description: "Account profile, funds limits, holdings, and positions requests"
