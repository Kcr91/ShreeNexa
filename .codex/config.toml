# Trusted-project defaults for ShreeNexa. This layer is intentionally narrow.
# Codex loads project .codex configuration only when the user trusts the repo.

approval_policy = "on-request"
sandbox_mode = "workspace-write"
project_doc_max_bytes = 32768

[sandbox_workspace_write]
network_access = false

# Optional local-only code discovery and review context. The server is not a
# correctness gate; source, tests, and the complete diff remain authoritative.
[mcp_servers.code_review_graph]
enabled = true
required = false
command = "F:\\ShreeNexa\\.venv\\Scripts\\code-review-graph.exe"
args = [
  "serve",
  "--repo",
  "F:\\ShreeNexa",
  "--tools",
  "get_minimal_context_tool,detect_changes_tool,get_review_context_tool,get_impact_radius_tool,query_graph_tool",
]
cwd = "F:\\ShreeNexa"
env = { PYTHONUTF8 = "1" }
startup_timeout_sec = 20.0
tool_timeout_sec = 120.0
enabled_tools = [
  "get_minimal_context_tool",
  "detect_changes_tool",
  "get_review_context_tool",
  "get_impact_radius_tool",
  "query_graph_tool",
]
