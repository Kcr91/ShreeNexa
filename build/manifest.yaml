# ShreeNexa feature manifest
#
# Source of truth: SHREENEXA_CODEX_VSCODE_BUILD_PLAN.md section 6 (feature-by-feature
# Codex work ledger). Each entry's name/depends_on/proof/model is transcribed from that
# document. Do not hand-edit totals or counts here — build/validate_manifest.py generates
# them from this list. If this manifest and the build plan ever disagree, the build plan
# governs and this file must be corrected to match it, per AGENTS.md.
#
# depends_on ranges in the build plan (e.g. "F0.5-F0.7") are expanded here to their
# explicit member IDs.

schema_version: 1

items:
  # --- M0: greenfield bootstrap -------------------------------------------------
  - id: M0.1
    name: 'Create F:\ShreeNexa, initialize git, verify Python/Node/git/Docker prerequisites, record versions, and create only the minimal README/bootstrap files.'
    depends_on: []
    proof: 'New independent repo exists; F:\Algotrading was not touched; environment audit names every blocker.'
    model: SOL-H

  - id: M0.2
    name: 'Freeze the greenfield architecture, process boundaries, storage ownership, package names, and Windows development topology as ADRs.'
    depends_on: [M0.1]
    proof: 'Module/dependency map has no circular process ownership and no dependency on the old project.'
    model: SOL-XH

  - id: M0.3
    name: "Define the new terminal's own data-root, immutable raw-download policy, warehouse versioning, backup boundary, and disk-capacity alarms."
    depends_on: [M0.1, M0.2]
    proof: 'Data lifecycle/rollback design; all data paths are under the new project or an explicitly configured new data root.'
    model: SOL-XH

  - id: M0.4
    name: 'Add AGENTS.md, scoped .codex/config.toml, architecture index, QA rules, protected paths, and completion-report template.'
    depends_on: [M0.1, M0.2, M0.3]
    proof: 'A fresh Codex chat can identify commands, boundaries, and done criteria without repo-wide exploration.'
    model: SOL-H

  - id: M0.5
    name: 'Convert the 102 listed features plus M0 into build/manifest.yaml; validate IDs, dependencies, cycles, and counts.'
    depends_on: [M0.4]
    proof: 'Manifest schema test; topological sort succeeds; count is generated, not handwritten.'
    model: TER-H

  - id: M0.6
    name: 'Establish the first green baseline and freeze small synthetic/reference fixtures by hash.'
    depends_on: [M0.1, M0.2, M0.3, M0.4, M0.5]
    proof: 'Clean clone bootstrap and empty test suite gates are green; no unexplained warnings.'
    model: TER-M

