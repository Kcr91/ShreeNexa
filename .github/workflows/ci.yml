name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --locked

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy backend --strict

      - name: Pytest (backend + build)
        run: uv run pytest -q

      - name: Validate feature manifest
        run: uv run python build/validate_manifest.py

      - name: Validate frozen fixtures
        run: uv run python build/validate_fixtures.py

  frontend:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
