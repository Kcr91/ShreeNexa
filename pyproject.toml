[project]
name = "shreenexa-backend"
version = "0.0.0"
description = "ShreeNexa Terminal backend — not yet implemented"
requires-python = ">=3.14,<3.15"
dependencies = []

[dependency-groups]
dev = [
    "ruff>=0.14,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.4,<9.0",
    "pre-commit>=4.0,<5.0",
    "pyyaml>=6.0,<7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend/app", "backend/tests", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "backend"
files = ["backend/app"]

[tool.pytest.ini_options]
testpaths = ["backend/tests", "build/tests"]
