[project]
name = "shreenexa-backend"
version = "0.0.0"
description = "ShreeNexa Terminal backend — not yet implemented"
requires-python = ">=3.14,<3.15"
dependencies = [
    "psycopg[binary]>=3.2,<4.0",
    "sqlalchemy>=2.0,<3.0",
    "alembic>=1.14,<2.0",
    "redis>=5.2,<6.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "psutil>=6.1,<7.0",
    "duckdb>=1.1",
    "pyarrow>=18.0",
]

[project.scripts]
api = "app.cli:run_api"
engine = "app.cli:run_engine"
feedd = "app.cli:run_feedd"
worker = "app.cli:run_worker"
supervisor = "app.cli:run_supervisor"

[dependency-groups]
dev = [
    "ruff>=0.14,<1.0",
    "mypy>=1.14,<2.0",
    "pytest>=8.4,<9.0",
    "pre-commit>=4.0,<5.0",
    "pyyaml>=6.0,<7.0",
    "types-pyyaml>=6.0,<7.0",
    "types-psutil>=6.1,<7.0",
    "hypothesis>=6.120,<7.0",
    "httpx>=0.28,<1.0",
    "code-review-graph==2.3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = ["backend/app", "backend/tests", "backend/alembic", "build"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "backend"
files = ["backend/app"]

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "duckdb", "duckdb.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["backend/tests", "build/tests"]
addopts = "--basetemp=build/pytest_tmp --ignore=build/tests/tmp"
norecursedirs = ["tmp", "build/tests/tmp", ".*", "node_modules"]
markers = [
    "no_auth_override: disable automatic session and csrf test dependency overrides",
]
